{% extends 'drilling/base.html' %}
{% block content %}
<div class="row gx-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 style="margin-bottom: 20px !important;">Создать проект</h3>
                <form method="post">
                    {% csrf_token %}
                    <input type="text" name="project_name" class="form-control" style="margin-bottom: 24px !important;" placeholder="Название" required>

                    <button type="submit" name="new_project" class="btn" style="padding: 10px 28px !important; width: 60%;">Добавить</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <h3 style="margin-bottom: 20px !important;">Ваши проекты</h3>
        <div class="list-group">
            {% for p in projects %}
                <a href="{% url 'project_detail' p.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" style="padding: 16px 20px;">
                    <span>{{ p.name }}</span>
                    <span style="color: #6c757d !important; font-size: 0.9rem;">{{ p.created_at|date:"d.m.Y" }}</span>
                </a>
            {% empty %}
                <div class="alert">Проектов нет</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
